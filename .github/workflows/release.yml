name: Publicar releases

# En este repo conviven dos cosas que se instalan por separado y se actualizan
# solas: el theme del sitio publico y el plugin del panel de promotores. Cada
# uno tiene su propia version, su propio tag y su propio zip.
#
# La regla que hace que convivan sin pisarse: **cada release lleva un solo
# zip**, y cada updater se queda con el release que trae EL SUYO
# (caaguazu-theme/inc/updater.php y el filtro de release de
# caaguazu-portal.php). Asi el updater del theme no confunde un release del
# plugin con uno suyo, ni al reves, sin depender de como se llamen los tags.
#
# Cada job arma su release solo si su tag todavia no existe, o sea: solo cuando
# subio el numero de version en el header correspondiente. No hace falta
# taggear a mano.
#
# Cada componente tiene su propio prefijo de tag: theme-X.Y.Z y portal-X.Y.Z.
# No es cosmetico. Antes los dos usaban vX.Y.Z, y el repo ya traia los tags
# v1.x a v5.0.1 del sistema viejo: cuando al theme le toco 5.0.1 y al panel
# 3.1.0, los dos tags ya existian y ninguno de los dos releases se publico
# nunca. Con un prefijo por componente cada serie es suya y no se cruza ni con
# la otra ni con la historia vieja.

on:
  push:
    branches: [main]
    paths:
      - 'caaguazu-theme/style.css'
      - 'caaguazu-portal/caaguazu-portal.php'

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer version del theme
        id: version
        run: |
          VERSION=$(grep -m1 '^Version:' caaguazu-theme/style.css | sed -E 's/Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "No se encontro la linea Version: en style.css" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=theme-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar si el tag ya existe
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el zip del theme
        if: steps.check.outputs.exists == 'false'
        run: bash bin/build-zip.sh theme

      - name: Crear Release y subir el zip
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            caaguazu-theme.zip \
            --title "Theme ${{ steps.version.outputs.version }}" \
            --generate-notes

  portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer version del plugin
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' caaguazu-portal/caaguazu-portal.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "No se encontro la linea Version: en caaguazu-portal.php" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=portal-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar si el tag ya existe
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el zip del plugin
        if: steps.check.outputs.exists == 'false'
        run: bash bin/build-zip.sh portal

      - name: Crear Release y subir el zip
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            caaguazu-portal.zip \
            --title "Panel ${{ steps.version.outputs.version }}" \
            --generate-notes
