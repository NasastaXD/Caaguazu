<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caaguazú · Vitrina</title>
<!-- Para mostrar en una presentación, no para que la encuentre un buscador. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efefef">
<link rel="icon" href="../assets/icon-192.png">
<link rel="preload" href="../fuentes/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vitrina.css">
</head>
<body>

<!--
  Dos vistas: la app en un teléfono (es la web de turismo de verdad, con sus
  datos) y el panel donde se carga, en un iPad y en un teléfono (maqueta con
  datos de mentira). Se cambia con las pestañas, con 1/2 o con las flechas; la
  dirección (#app, #panel) abre una directa.

  Modo proyección (tecla P, o ?proyectar=1): sin pestañas ni QR, sólo los
  aparatos. Se sigue manejando con el teclado desde la computadora.
-->
<nav class="pestanas" role="tablist">
  <a class="pestana" role="tab" href="#app" data-vista="app">App</a>
  <a class="pestana" role="tab" href="#panel" data-vista="panel">Panel</a>
</nav>

<main class="escenario">
  <section class="vista" id="vista-app" data-vista="app">
    <div class="grupo" id="grupo-app">
      <div class="telefono">
        <div class="telefono__pantalla">
          <!-- La franja de arriba es la del sistema: la app empieza debajo,
               como en un teléfono de verdad, y la isla no le tapa la cabecera. -->
          <span class="telefono__estado" aria-hidden="true"><span class="telefono__isla"></span></span>
          <iframe id="marco-app" title="App" data-src="../"></iframe>
        </div>
      </div>
      <figure class="qr" id="qr" aria-hidden="true"></figure>
    </div>
  </section>

  <section class="vista" id="vista-panel" data-vista="panel" hidden>
    <div class="grupo" id="grupo-panel">
      <div class="tableta">
        <div class="tableta__pantalla">
          <iframe id="marco-panel" title="Panel en tableta" data-src="panel/home.html"></iframe>
        </div>
      </div>
      <div class="telefono">
        <div class="telefono__pantalla">
          <span class="telefono__estado" aria-hidden="true"><span class="telefono__isla"></span></span>
          <iframe id="marco-panel-tel" title="Panel en teléfono" data-src="panel/home.html"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="../js/vendor/qrcode.js" defer></script>
<script src="vitrina.js" defer></script>
</body>
</html>
