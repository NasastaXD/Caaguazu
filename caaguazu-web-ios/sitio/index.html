<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caaguazú Turismo</title>
<meta name="description" content="Guía turística de Caaguazú: qué visitar, artículos y un asistente para preguntar. Sin instalar nada y sin crear una cuenta.">

<!--
  El tema se decide ANTES de pintar nada: si lo resolviera app.js, la página
  aparecería un instante con el tema equivocado y después saltaría al otro.
  «sistema» (lo que viene de fábrica) sigue al teléfono; ver js/tema.js.
-->
<script>
  (function () {
    var elegido = "sistema";
    try { elegido = localStorage.getItem("czu.tema") || "sistema"; } catch (e) {}
    var oscuro = elegido === "oscuro" ||
      (elegido === "sistema" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
  })();
</script>
<meta name="theme-color" content="#f4f4f2" id="color-tema">

<!-- Agregar a inicio, en iPhone y en Android -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caaguazú">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- La letra del panel, servida desde acá: ver fuentes/. Sólo se precargan
     las dos que se ven al abrir; la 700 llega cuando aparece. -->

<link rel="preload" href="fuentes/inter-600.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/estilo.css">
</head>

</body>
</html>
